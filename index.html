<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nav was here</title>
  <style>
    /* Reset some default styles */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    /* Dark background for the page */
    body {
      background-color: #1e1e1e;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100%;
    }

    /* Heading style */
    h1 {
      text-align: center;
      font-size: 2em;
      margin-bottom: 50px;
    }

    /* Style for the file input */
    .file-input {
      background-color: #333;
      border: 2px solid #00b0ff;
      color: white;
      padding: 15px 30px;
      font-size: 1.2em;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      position: relative;
      transition: all 0.3s ease;
    }

    /* Button hover and focus effects */
    .file-input:hover {
      background-color: #00b0ff;
      color: black;
    }
  </style>
</head>
<body>

  <h1>Nav's website loader 2.0</h1>
  <input type="file" id="fileInput" class="file-input" accept=".html" value="Load Html File">

  <script>
    const fileInput = document.getElementById('fileInput');

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const htmlContent = e.target.result;

          // Insert the loaded HTML content into the body
          document.body.innerHTML = htmlContent;

          // After the HTML is loaded, request pointer lock
          const bodyElement = document.body;

          bodyElement.addEventListener('click', () => {
            // Request pointer lock on the body
            if (bodyElement.requestPointerLock) {
              bodyElement.requestPointerLock();
            }
          });
        };
        reader.readAsText(file);
      }
    });
  </script>

</body>
</html>
